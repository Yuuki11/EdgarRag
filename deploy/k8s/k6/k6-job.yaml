apiVersion: batch/v1
kind: Job
metadata:
  name: finedgar-k6
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          env:
            - name: BASE_URL
              value: http://traefik.gateway-system.svc.cluster.local
            - name: HOST_HEADER
              value: finedgar.localhost
          command: ["k6", "run", "/scripts/load-test.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: finedgar-k6-scripts
