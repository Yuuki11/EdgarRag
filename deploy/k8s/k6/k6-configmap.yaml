apiVersion: v1
kind: ConfigMap
metadata:
  name: finedgar-k6-scripts
data:
  load-test.js: |
    import http from "k6/http";
    import { check, sleep } from "k6";

    export const options = {
      stages: [
        { duration: "30s", target: 10 },
        { duration: "2m", target: 30 },
        { duration: "30s", target: 0 }
      ],
      thresholds: {
        http_req_failed: ["rate<0.05"],
        http_req_duration: ["p(95)<1000"]
      }
    };

    const baseUrl = __ENV.BASE_URL || "http://traefik.gateway-system.svc.cluster.local";
    const hostHeader = __ENV.HOST_HEADER || "finedgar.localhost";
    const params = {
      headers: {
        Host: hostHeader
      }
    };

    export default function () {
      const health = http.get(`${baseUrl}/healthz`, params);
      check(health, {
        "health status is 200": (r) => r.status === 200,
        "health has ollama flag": (r) => r.body.includes("ollama_reachable")
      });

      const companies = http.get(`${baseUrl}/api/companies`, params);
      check(companies, {
        "companies status is 200": (r) => r.status === 200
      });

      sleep(1);
    }
