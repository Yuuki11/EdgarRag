{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finedgar.secretName" . }}
  labels:
    {{- include "finedgar.labels" . | nindent 4 }}
type: Opaque
stringData:
  SEC_USER_AGENT: {{ .Values.secrets.secUserAgent | quote }}
  FINEDGAR_AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  FINEDGAR_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  WANDB_API_KEY: {{ .Values.secrets.wandbApiKey | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  username: {{ .Values.postgres.user | quote }}
  password: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "finedgar.databaseUrl" . | quote }}
{{- end }}
