apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finedgar.fullname" . }}-config
  labels:
    {{- include "finedgar.labels" . | nindent 4 }}
data:
  OLLAMA_HOST: http://{{ include "finedgar.fullname" . }}-ollama:{{ .Values.ollama.port }}
  OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}
  CHROMADB_PATH: {{ .Values.config.chromadbPath | quote }}
  FINEDGAR_FORCE_CPU: {{ .Values.config.forceCpu | quote }}
  FINEDGAR_AUTH_COOKIE_SECURE: {{ .Values.config.authCookieSecure | quote }}
  FINEDGAR_PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  FINEDGAR_ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  FINEDGAR_ALLOW_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  FINEDGAR_EMAIL_MODE: {{ .Values.config.emailMode | quote }}
  FINEDGAR_EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
  FINEDGAR_SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  FINEDGAR_SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  FINEDGAR_SMTP_USERNAME: {{ .Values.config.smtpUsername | quote }}
  FINEDGAR_SMTP_STARTTLS: {{ .Values.config.smtpStarttls | quote }}
  HF_HOME: /cache/huggingface
  TORCH_HOME: /cache/torch
  FINEDGAR_OTEL_ENABLED: {{ ternary "1" "0" .Values.observability.tracing.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.tracing.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: finedgar-web
