apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finedgar.fullname" . }}-web
  labels:
    {{- include "finedgar.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "finedgar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "finedgar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: {{ ternary "true" "false" .Values.observability.metrics.enabled | quote }}
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.web.port | quote }}
    spec:
      serviceAccountName: {{ include "finedgar.serviceAccountName" . }}
      initContainers:
        - name: seed-data
          image: "{{ .Values.runtimeImage.repository }}:{{ .Values.runtimeImage.tag }}"
          imagePullPolicy: {{ .Values.runtimeImage.pullPolicy }}
          command:
            - sh
            - -c
            - |
              mkdir -p /seed-data
              cp -an /app/data/. /seed-data/
          volumeMounts:
            - name: data
              mountPath: /seed-data
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "webapp.backend.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.web.port }}"]
          envFrom:
            - configMapRef:
                name: {{ include "finedgar.fullname" . }}-config
            - secretRef:
                name: {{ include "finedgar.secretName" . }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FINEDGAR_RELEASE
              value: {{ .Chart.AppVersion | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: outputs
              mountPath: /app/outputs
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: torch-cache
              mountPath: /cache/torch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "finedgar.fullname" . }}-data
        - name: outputs
          persistentVolumeClaim:
            claimName: {{ include "finedgar.fullname" . }}-outputs
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ include "finedgar.fullname" . }}-hf-cache
        - name: torch-cache
          persistentVolumeClaim:
            claimName: {{ include "finedgar.fullname" . }}-torch-cache
