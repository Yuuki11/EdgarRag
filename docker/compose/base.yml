name: finedgar

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./model:/app/model
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - finedgar

networks:
  finedgar:
    driver: bridge

volumes:
  ollama-data:
  hf-cache:
  torch-cache:
  pip-cache:
  frontend-node-modules:
