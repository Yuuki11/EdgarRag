services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finedgar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before running DB workflows}
      POSTGRES_DB: ${POSTGRES_DB:-finedgar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${FINEDGAR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - finedgar

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      target: runtime
    image: finedgar-runtime:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finedgar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finedgar}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finedgar

volumes:
  postgres-data:
