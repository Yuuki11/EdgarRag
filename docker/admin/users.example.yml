# Copy this file to docker/admin/users.yml or generate one with:
#   scripts/docker/compose.sh admin generate-user admin -- --password '<strong-password>' --name 'FinEdgar Admin' --email admin@example.com > docker/admin/users.yml
#
# The password value must be a bcrypt hash generated by Dozzle. Do not place a
# plaintext password here.
users:
  admin:
    email: admin@example.com
    name: FinEdgar Admin
    password: "$2a$11$replace-this-with-a-dozzle-generated-bcrypt-hash"
    roles: none
